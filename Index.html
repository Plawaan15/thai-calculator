<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Thai 60/40 Allowance Calculator - Dark Mode</title>
<style>
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background-color: #0f172a; /* Deep slate background */
    color: #f1f5f9; 
    display: flex; 
    justify-content: center; 
    padding: 40px 20px; 
  }
  .card { 
    background: #1e293b; /* Sleek card background */
    padding: 30px; 
    border-radius: 16px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
    max-width: 380px; 
    width: 100%; 
    border: 1px solid #334155;
  }
  h2 { 
    margin-top: 0; 
    text-align: center; 
    color: #38bdf8; /* Vibrant cyan/blue */
    font-size: 24px;
    margin-bottom: 25px;
    letter-spacing: 0.5px;
  }
  label { 
    display: block; 
    margin-bottom: 10px; 
    font-weight: 600; 
    font-size: 15px; 
    color: #94a3b8;
  }
  input { 
    width: 100%; 
    padding: 14px; 
    border: 2px solid #334155; 
    background-color: #0f172a;
    border-radius: 10px; 
    font-size: 20px; 
    box-sizing: border-box; 
    margin-bottom: 25px; 
    outline: none;
    font-weight: bold;
    text-align: center;
    color: #ffffff;
    transition: border-color 0.2s;
  }
  input:focus {
    border-color: #38bdf8;
  }
  /* Hide arrows on input number */
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .result-box { 
    background: #111827; 
    border: 1px solid #374151; 
    padding: 20px; 
    border-radius: 12px; 
  }
  .row { 
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    margin-bottom: 15px; 
    font-size: 16px; 
  }
  .row.highlight {
    margin-bottom: 0;
    padding-top: 15px;
    border-top: 2px dashed #374151;
  }
  /* Force symbols to stay on the same line */
  .val-total { color: #38bdf8; font-weight: 800; font-size: 24px; white-space: nowrap; }
  .val-you { color: #f87171; font-weight: bold; white-space: nowrap; }
  .val-gov { color: #4ade80; font-weight: bold; white-space: nowrap; }
  
  .formula-note {
    font-size: 13px;
    color: #64748b;
    text-align: center;
    margin-top: 25px;
    line-height: 1.5;
  }
</style>
</head>
<body>

<div class="card">
  <h2>60/40 Calculator</h2>
  
  <label for="govInput">Enter Government Allowance (Baht):</label>
  <input type="number" id="govInput" value="200" oninput="calculatePower()" placeholder="e.g. 200">

  <div class="result-box">
    <div class="row">
      <span>Government Pays (60%):</span>
      <span class="val-gov" id="govShare">200.00&nbsp;฿</span>
    </div>
    <div class="row">
      <span>You Pay (40%):</span>
      <span class="val-you" id="yourShare">133.33&nbsp;฿</span>
    </div>
    <div class="row highlight">
      <span>Total Spending Power:</span>
      <span class="val-total" id="totalPower">333.33&nbsp;฿</span>
    </div>
  </div>

  <div class="formula-note">
    <strong>How it works:</strong><br>
    Total Spending = Government Allowance ÷ 0.60<br>
    Your Share = Total Spending × 0.40
  </div>
</div>

<script>
  function calculatePower() {
    let govAllowance = Math.max(0, parseFloat(document.getElementById('govInput').value) || 0);
    
    let total = govAllowance / 0.60;
    let youPay = total * 0.40;

    // Uses non-breaking space characters to prevent symbol wrapping
    document.getElementById('govShare').textContent = govAllowance.toFixed(2) + '\u00A0฿';
    document.getElementById('yourShare').textContent = youPay.toFixed(2) + '\u00A0฿';
    document.getElementById('totalPower').textContent = total.toFixed(2) + '\u00A0฿';
  }
  
  calculatePower();
</script>

</body>
</html>
