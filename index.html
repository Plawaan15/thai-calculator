<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เครื่องคิดเลข 60/40</title>
<style>
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background-color: #0f172a; 
    color: #f1f5f9; 
    display: flex; 
    justify-content: center; 
    padding: 40px 20px; 
  }
  .card { 
    background: #1e293b; 
    padding: 30px; 
    border-radius: 16px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
    max-width: 380px; 
    width: 100%; 
    border: 1px solid #334155;
  }
  h2 { 
    margin-top: 0; 
    text-align: center; 
    color: #38bdf8; 
    font-size: 24px;
    margin-bottom: 25px;
    letter-spacing: 0.5px;
  }
  label { 
    display: block; 
    margin-bottom: 10px; 
    font-weight: 600; 
    font-size: 16px; 
    color: #94a3b8;
  }
  input { 
    width: 100%; 
    padding: 14px; 
    border: 2px solid #334155; 
    background-color: #0f172a;
    border-radius: 10px; 
    font-size: 22px; /* Set to match the result numbers below */
    box-sizing: border-box; 
    margin-bottom: 25px; 
    outline: none;
    font-weight: bold;
    text-align: center;
    color: #ffffff;
    transition: border-color 0.2s;
  }
  input:focus {
    border-color: #38bdf8;
  }
  /* Hide arrows on input number */
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .result-box { 
    background: #111827; 
    border: 1px solid #374151; 
    padding: 20px; 
    border-radius: 12px; 
  }
  .row { 
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    margin-bottom: 15px; 
    font-size: 16px; 
  }
  .row.highlight {
    margin-bottom: 0;
    padding-top: 15px;
    border-top: 2px dashed #374151;
  }
  /* All result numbers are now exactly size 22px */
  .val-total { color: #38bdf8; font-weight: 800; font-size: 22px; white-space: nowrap; }
  .val-you { color: #f87171; font-weight: bold; font-size: 22px; white-space: nowrap; }
  .val-gov { color: #4ade80; font-weight: bold; font-size: 22px; white-space: nowrap; }
</style>
</head>
<body>

<div class="card">
  <h2>เครื่องคิดเลข 60/40</h2>
  
  <label for="govInput">ระบุจำนวนเงินที่รัฐช่วย (บาท):</label>
  <input type="number" id="govInput" value="200" oninput="calculatePower()" placeholder="เช่น 200">

  <div class="result-box">
    <div class="row">
      <span>รัฐออกให้ (60%):</span>
      <span class="val-gov" id="govShare">200.00&nbsp;฿</span>
    </div>
    <div class="row">
      <span>คุณจ่ายเอง (40%):</span>
      <span class="val-you" id="yourShare">133.33&nbsp;฿</span>
    </div>
    <div class="row highlight">
      <span>ยอดใช้จ่ายรวม:</span>
      <span class="val-total" id="totalPower">333.33&nbsp;฿</span>
    </div>
  </div>
</div>

<script>
  function calculatePower() {
    let govAllowance = Math.max(0, parseFloat(document.getElementById('govInput').value) || 0);
    
    let total = govAllowance / 0.60;
    let youPay = total * 0.40;

    document.getElementById('govShare').textContent = govAllowance.toFixed(2) + '\u00A0฿';
    document.getElementById('yourShare').textContent = youPay.toFixed(2) + '\u00A0฿';
    document.getElementById('totalPower').textContent = total.toFixed(2) + '\u00A0฿';
  }
  
  calculatePower();
</script>

</body>
</html>
