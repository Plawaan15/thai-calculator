<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เครื่องคิดเลข 60/40</title>
<style>
  body { 
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
    background-color: #0f172a; 
    color: #f1f5f9; 
    display: flex; 
    justify-content: center; 
    padding: 40px 20px; 
  }
  .card { 
    background: #1e293b; 
    padding: 30px; 
    border-radius: 16px; 
    box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
    max-width: 380px; 
    width: 100%; 
    border: 1px solid #334155;
  }
  label { 
    display: block; 
    margin-bottom: 10px; 
    font-weight: 600; 
    font-size: 16px; 
    color: #94a3b8;
  }
  input { 
    width: 100%; 
    padding: 14px; 
    border: 2px solid #334155; 
    background-color: #0f172a;
    border-radius: 10px; 
    font-size: 22px; 
    box-sizing: border-box; 
    margin-bottom: 20px; 
    outline: none;
    font-weight: bold;
    text-align: center;
    color: #ffffff;
    transition: border-color 0.2s;
  }
  input:focus {
    border-color: #38bdf8;
  }
  input::-webkit-outer-spin-button,
  input::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  .result-box { 
    background: #111827; 
    border: 1px solid #374151; 
    padding: 20px; 
    border-radius: 12px; 
  }
  .row { 
    display: flex; 
    justify-content: space-between; 
    align-items: center;
    margin-bottom: 15px; 
    font-size: 16px; 
  }
  .row:last-child {
    margin-bottom: 0;
  }
  .row.highlight {
    padding-top: 15px;
    border-top: 2px dashed #374151;
  }
  
  .val-total { color: #38bdf8; font-weight: 800; font-size: 22px; white-space: nowrap; }
  .val-you { color: #f87171; font-weight: bold; font-size: 22px; white-space: nowrap; }
  .val-gov { color: #4ade80; font-weight: bold; font-size: 22px; white-space: nowrap; }
  
  .device-block {
    border-left: 2px solid #334155;
    padding-left: 15px;
    margin: 15px 0 15px 5px;
  }
  .device-title {
    font-size: 16px;
    font-weight: bold;
    color: #38bdf8;
    margin-bottom: 8px;
  }
  
  .device-block-extra {
    border-left: 2px solid #ef4444;
    padding-left: 15px;
    margin: 15px 0 15px 5px;
  }
  .device-title-extra {
    font-size: 16px;
    font-weight: bold;
    color: #ef4444;
    margin-bottom: 8px;
  }

  .small-row {
    margin-bottom: 8px !important;
  }
  .val-gov-sub { color: #4ade80; font-weight: bold; font-size: 22px; white-space: nowrap; }
  .val-you-sub { color: #f87171; font-weight: bold; font-size: 22px; white-space: nowrap; }

  hr.divider {
    border: 0;
    border-top: 1px solid #334155;
    margin: 30px 0;
  }
  
  .input-group {
    display: flex;
    gap: 15px;
  }
  .input-wrapper {
    flex: 1;
  }
</style>
</head>
<body>

<div class="card">
  
  <div class="input-group">
    <div class="input-wrapper">
      <label for="priceInput">ราคาสินค้า (บาท)</label>
      <input type="number" id="priceInput" oninput="calculatePrice()">
    </div>
    <div class="input-wrapper">
      <label for="deviceInput">จำนวนเครื่อง:</label>
      <input type="number" id="deviceInput" value="1" min="1" step="1" oninput="calculatePrice()">
    </div>
  </div>

  <div class="result-box">
    <div class="row">
      <span>รัฐออกรวม:</span>
      <span class="val-gov" id="itemGovShare">0.00&nbsp;฿</span>
    </div>
    
    <div id="deviceBreakdown"></div>

    <div class="row highlight">
      <span>คุณจ่ายรวมทั้งหมด:</span>
      <span class="val-you" id="itemYourShare">0.00&nbsp;฿</span>
    </div>
  </div>

  <hr class="divider">

  <label for="govInput">ระบุจำนวนเงินที่รัฐช่วย (บาท):</label>
  <input type="number" id="govInput" oninput="calculatePower()" placeholder="เช่น 200">

  <div class="result-box">
    <div class="row">
      <span>รัฐออก (60%):</span>
      <span class="val-gov" id="govShare">0.00&nbsp;฿</span>
    </div>
    <div class="row">
      <span>คุณจ่าย (40%):</span>
      <span class="val-you" id="yourShare">0.00&nbsp;฿</span>
    </div>
    <div class="row highlight">
      <span>ยอดใช้จ่ายรวม:</span>
      <span class="val-total" id="totalPower">0.00&nbsp;฿</span>
    </div>
  </div>

</div>

<script>
  function calculatePower() {
    let govAllowance = Math.max(0, parseFloat(document.getElementById('govInput').value) || 0);
    let total = govAllowance / 0.60;
    let youPay = total * 0.40;

    document.getElementById('govShare').textContent = govAllowance.toFixed(2) + '\u00A0฿';
    document.getElementById('yourShare').textContent = youPay.toFixed(2) + '\u00A0฿';
    document.getElementById('totalPower').textContent = total.toFixed(2) + '\u00A0฿';
  }
  
  function calculatePrice() {
    let price = Math.max(0, parseFloat(document.getElementById('priceInput').value) || 0);
    // ค่าเริ่มต้นเป็น 1 เสมอ หากปล่อยว่างไว้
    let availableDevices = Math.max(1, parseInt(document.getElementById('deviceInput').value) || 1);
    
    let maxGovTotal = availableDevices * 200;
    let theoreticalGovPay = price * 0.60;
    
    let actualGovPay = Math.min(theoreticalGovPay, maxGovTotal);
    let actualYouPay = price - actualGovPay;

    document.getElementById('itemGovShare').textContent = actualGovPay.toFixed(2) + '\u00A0฿';
    document.getElementById('itemYourShare').textContent = actualYouPay.toFixed(2) + '\u00A0฿';

    let breakdownHTML = '';
    
    if (theoreticalGovPay > 200 || actualGovPay === maxGovTotal) {
      let remainingGov = actualGovPay;
      let deviceCount = 1;
      let totalDeviceUserPay = 0;
      
      if (price > 0) {
        while (remainingGov > 0.001 && deviceCount <= availableDevices) {
          let govAmount = Math.min(200, remainingGov);
          let userAmount = (govAmount / 0.60) * 0.40;
          totalDeviceUserPay += userAmount;
          
          breakdownHTML += `
            <div class="device-block">
              <div class="device-title">📱 เครื่องที่ ${deviceCount}</div>
              <div class="row small-row">
                <span>- รัฐออก (60%):</span>
                <span class="val-gov-sub">${govAmount.toFixed(2)}\u00A0฿</span>
              </div>
              <div class="row small-row">
                <span>- เติมเงิน (40%):</span>
                <span class="val-you-sub">${userAmount.toFixed(2)}\u00A0฿</span>
              </div>
            </div>
          `;
          remainingGov -= govAmount;
          deviceCount++;
        }
        
        let unsupportedPrice = actualYouPay - totalDeviceUserPay;
        if (unsupportedPrice > 0.01) {
          breakdownHTML += `
            <div class="device-block-extra">
              <div class="device-title-extra">💸 ส่วนต่างที่เกินโควตา</div>
              <div class="row small-row">
                <span>- จ่ายเต็ม:</span>
                <span class="val-you-sub">${unsupportedPrice.toFixed(2)}\u00A0฿</span>
              </div>
            </div>
          `;
        }
      }
    }
    
    document.getElementById('deviceBreakdown').innerHTML = breakdownHTML;
  }

  // เซ็ตค่าเริ่มต้นเป็น 0 ทันทีที่เปิดแอป
  calculatePower();
  calculatePrice();
</script>

</body>
</html>
